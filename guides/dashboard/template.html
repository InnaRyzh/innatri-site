<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InnaTri</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141414; --bg2:#1c1c1b; --bg3:#262624; --ink:#f2eee6; --soft:#a8a29a; --mute:#6f6a63;
  --easy:#4F93F5; --hard:#F0523E; --easy-soft:rgba(79,147,245,.28); --hard-soft:rgba(240,82,62,.22);
  --display:'Unbounded',system-ui,sans-serif; --text:'Onest',system-ui,sans-serif;
  --w:1160px; --gap:24px;
}
*{box-sizing:border-box}
html{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{margin:0;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.045;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{position:relative;z-index:1;max-width:var(--w);margin:0 auto;padding:0 var(--gap)}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(30px,4.6vw,58px);line-height:1.02;max-width:16ch}
h2{font-size:clamp(22px,2.4vw,30px);line-height:1.15;max-width:22ch}
p{margin:0}
.lead{font-size:clamp(17px,1.5vw,20px);line-height:1.45;max-width:62ch;color:var(--ink)}
.note{color:var(--soft);font-size:15px;line-height:1.5;max-width:66ch}
svg text{font-family:var(--text)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 0;flex-wrap:wrap}
.mark{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em}
.mark span{font-weight:400;color:var(--soft);margin-left:10px;font-family:var(--text);letter-spacing:0}
.meta{color:var(--soft);font-size:14px}
.seg{display:inline-flex;background:var(--bg2);border-radius:999px;padding:3px}
.seg button{padding:8px 16px;border-radius:999px;color:var(--soft);font-size:14px;font-weight:500;transition:color .2s,background .2s}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button:hover:not([aria-pressed=true]){color:var(--ink)}

/* ---------- hero ---------- */
.hero{padding:88px 0 0}
.hero .kick{color:var(--soft);font-size:15px;margin-bottom:18px}
.hero h1{margin-bottom:26px}
.warn{margin-top:28px;padding:14px 18px;border-left:3px solid var(--hard);background:var(--bg2);color:var(--ink);max-width:70ch;font-size:15px}
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);margin-top:64px}
.fig{padding-top:18px;border-top:2px solid var(--bg3)}
.fig .v{font-family:var(--display);font-size:clamp(34px,3.6vw,46px);line-height:1;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fig .v small{font-size:.5em;font-weight:400;color:var(--soft);margin-left:4px}
.fig .l{margin-top:12px;font-size:15px;color:var(--ink)}
.fig .d{margin-top:6px;font-size:14px;color:var(--soft)}
.fig .d b{font-weight:600;color:var(--ink)}
.fig .d .good{color:var(--easy)} .fig .d .bad{color:var(--hard)}

/* ---------- sections ---------- */
section{padding-top:128px}
.head{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px var(--gap);align-items:start;margin-bottom:34px}
.head .lead{color:var(--soft);font-size:16px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px var(--gap)}
.panel h3{font-family:var(--text);font-weight:600;font-size:17px;margin-bottom:6px}
.panel .note{margin-bottom:18px;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;color:var(--soft);font-size:14px;margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:8px}
.legend .dot i{border-radius:50%;width:9px;height:9px;border:2px solid var(--ink);background:none}
.legend .tick i{width:12px;height:3px;background:var(--hard);vertical-align:3px}

/* ---------- horizon ---------- */
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--gap);align-items:center;margin-top:22px;padding:20px 24px;background:var(--bg2);border-radius:16px}
.ctl .read{display:flex;flex-wrap:wrap;gap:8px 34px;align-items:baseline}
.ctl .read b{font-family:var(--display);font-weight:500;font-size:28px;font-variant-numeric:tabular-nums}
.ctl .read span{color:var(--soft);font-size:14px;display:block}
.ctl .slide{display:flex;align-items:center;gap:14px;color:var(--soft);font-size:14px}
input[type=range]{-webkit-appearance:none;appearance:none;width:220px;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--bg3);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);margin-top:-9.5px;cursor:grab;transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.12)}
input[type=range]::-moz-range-track{height:3px;background:var(--bg3)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--ink)}
.reset{color:var(--soft);text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.reset:hover{color:var(--ink)}
.shift{margin-top:12px;color:var(--soft);font-size:14px;min-height:21px}
.shift b{color:var(--ink);font-weight:600}
.run{transition:fill .25s, transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s;transform-box:fill-box;transform-origin:center;cursor:pointer}
.run:hover{stroke:var(--ink);stroke-width:2}
.pre .run{transform:scale(0);opacity:0}
.ceil{cursor:ns-resize}
.ceil .h{transition:transform .15s;transform-box:fill-box;transform-origin:center}
.ceil:hover .h{transform:scale(1.15)}

/* ---------- tape ---------- */
.wk{cursor:pointer}
.wk rect.blk{transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-box:fill-box;transform-origin:bottom}
.pre .wk rect.blk{transform:scaleY(0)}
.wk:hover .hit, .wk.on .hit{fill:rgba(242,238,230,.06)}
.week{margin-top:28px;background:var(--bg2);border-radius:16px;padding:24px 28px 28px;display:none}
.week.on{display:block;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.week .hd{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.week .hd h3{font-family:var(--display);font-weight:500;font-size:20px}
.week .sum{color:var(--soft);font-size:14px;display:flex;gap:22px;flex-wrap:wrap;align-items:baseline}
.week .sum b{color:var(--ink);font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.day{min-height:120px;background:var(--bg);border-radius:10px;padding:10px 10px 8px}
.day .dn{font-size:13px;color:var(--mute);margin-bottom:8px}
.day .dn b{color:var(--soft);font-weight:500}
.chip{border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;line-height:1.35;background:var(--easy-soft);border-left:3px solid var(--easy);cursor:pointer}
.chip.hard{background:var(--hard-soft);border-left-color:var(--hard)}
.chip.nohr{background:var(--bg3);border-left-color:var(--mute)}
.chip.other{background:transparent;border-left-color:var(--bg3);color:var(--soft);cursor:default}
.chip b{display:block;font-weight:600;font-size:14px}
.cl{color:var(--soft);text-decoration:underline;text-underline-offset:3px}
.cl:hover{color:var(--ink)}

/* ---------- drill ---------- */
.drill{margin-top:28px;background:var(--bg2);border-radius:16px;padding:22px 28px;display:none}
.drill.on{display:block;animation:up .35s cubic-bezier(.2,.8,.2,1)}
.drill .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:16px}
.drill .hd h3{font-family:var(--display);font-weight:500;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--soft);font-weight:500;padding:8px 10px 10px 0;border-bottom:1px solid var(--bg3)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--bg3);white-space:nowrap}
th.n,td.n{text-align:right}
td.fast{color:var(--hard)} td.name{white-space:normal;color:var(--soft);max-width:28ch}

/* ---------- method ---------- */
.method{display:grid;grid-template-columns:1fr 1fr;gap:40px var(--gap)}
.method h3{font-family:var(--display);font-weight:500;font-size:20px;margin-bottom:18px}
.method ul{margin:0;padding:0;list-style:none}
.method li{padding:12px 0;border-top:1px solid var(--bg3);color:var(--soft);font-size:15px;line-height:1.5}
.method li b{color:var(--ink);font-weight:600}
.method li:last-child{border-bottom:1px solid var(--bg3)}

/* ---------- footer ---------- */
footer{margin-top:140px;padding:72px 0 56px;background:var(--bg2);position:relative;z-index:1}
footer .cta{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px var(--gap);align-items:center}
footer h2{max-width:24ch}
footer .btn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:600;padding:16px 26px;border-radius:999px;transition:transform .15s}
footer .btn:hover{transform:translateY(-1px)}
footer .btn:active{transform:translateY(1px)}
footer .fine{margin-top:40px;color:var(--mute);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- tooltip ---------- */
#tip{position:fixed;z-index:9;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;line-height:1.4;padding:9px 12px;border-radius:8px;max-width:280px;opacity:0;transition:opacity .12s;transform:translate(-50%,calc(-100% - 14px))}
#tip b{font-weight:600}

/* ---------- motion & phone ---------- */
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.pre .run,.pre .wk rect.blk{transform:none;opacity:1}}
@media (max-width:860px){
  :root{--gap:16px}
  .figs{grid-template-columns:1fr 1fr;gap:28px 16px;margin-top:48px}
  .head,.two,.method,footer .cta,.ctl{grid-template-columns:1fr}
  section{padding-top:88px}
  .hero{padding-top:56px}
  .days{grid-template-columns:repeat(2,1fr)}
  .week,.drill,.ctl{padding:18px 16px;border-radius:12px}
  input[type=range]{width:100%}
  .ctl .slide{flex-wrap:wrap}
  .top{padding-top:16px}
}
</style>
</head>
<body class="pre">
<div class="wrap">

<header class="top">
  <div class="mark">INNA TRI<span data-t="mark_sub"></span></div>
  <div class="meta" id="meta"></div>
  <div class="seg" role="group" id="seg">
    <button data-p="3" aria-pressed="false"></button><button data-p="6" aria-pressed="false"></button><button data-p="12" aria-pressed="true"></button>
  </div>
</header>

<section class="hero">
  <p class="kick" id="kick"></p>
  <h1 id="v-title"></h1>
  <p class="lead" id="v-text"></p>
  <div id="warns"></div>
  <div class="figs" id="figs"></div>
</section>

<section class="horizon">
  <div class="head">
    <h2 data-t="hz_h2"></h2>
    <p class="lead" id="hz-lead"></p>
  </div>
  <div id="c-hz"></div>
  <div class="ctl">
    <div class="read" id="hz-read"></div>
    <div class="slide"><span data-t="ceil_label"></span><input type="range" id="ceil" min="115" max="175" step="1"><button class="reset" id="ceil-reset" data-t="reset"></button></div>
  </div>
  <p class="shift" id="hz-shift"></p>
  <div class="drill" id="drill-run"></div>
</section>

<section class="tape">
  <div class="head">
    <h2 data-t="tape_h2"></h2>
    <p class="lead" data-t="tape_lead"></p>
  </div>
  <div id="c-tape"></div>
  <div class="legend"><span><i style="background:var(--easy)"></i><span data-t="lg_easy"></span></span><span><i style="background:var(--hard)"></i><span data-t="lg_fast"></span></span><span><i style="background:var(--bg3)"></i><span data-t="lg_nohr"></span></span><span class="tick"><i></i><span data-t="lg_hard"></span></span><span class="dot"><i></i><span data-t="lg_deload"></span></span></div>
  <div class="week" id="week"></div>
</section>

<section class="months">
  <div class="head">
    <h2 data-t="mo_h2"></h2>
    <p class="lead" data-t="mo_lead"></p>
  </div>
  <div class="two">
    <div class="panel"><h3 data-t="int_h3"></h3><p class="note" data-t="int_note"></p><div id="c-int"></div></div>
    <div class="panel"><h3 data-t="easy_h3"></h3><p class="note" data-t="easy_note"></p><div id="c-easy"></div></div>
  </div>
  <div class="drill" id="drill"></div>
</section>

<section class="form">
  <div class="head">
    <h2 data-t="form_h2"></h2>
    <p class="lead" data-t="form_lead"></p>
  </div>
  <div class="two">
    <div class="panel"><h3 data-t="eff_h3"></h3><p class="note" id="eff-note"></p><div id="c-eff"></div></div>
    <div class="panel"><h3 data-t="rhr_h3"></h3><p class="note" data-t="rhr_note"></p><div id="c-rhr"></div></div>
  </div>
</section>

<section class="method-s">
  <div class="method">
    <div><h3 data-t="how_h3"></h3><ul id="how"></ul></div>
    <div><h3 data-t="unk_h3"></h3><ul id="unk"></ul></div>
  </div>
</section>

</div>

<footer>
  <div class="wrap">
    <div class="cta">
      <h2 data-t="cta_h2"></h2>
      <div><a class="btn" href="https://www.instagram.com/inna.tri/" target="_blank" rel="noopener" data-t="cta_btn"></a></div>
    </div>
    <div class="fine"><span data-t="fine"></span><span id="built"></span></div>
  </div>
</footer>

<div id="tip" role="tooltip"></div>

<script>
const D = /*__DATA__*/null;
const LANG = (D.lang || 'ru');
document.documentElement.lang = LANG === 'uk' ? 'uk' : LANG;

// ---------- словарь ----------
const slav = (n, f) => { const m = n % 100, k = n % 10; return (m > 10 && m < 20) ? f[2] : k === 1 ? f[0] : (k > 1 && k < 5) ? f[1] : f[2]; };
const L = {
ru: {
  plural: (n, f) => n + ' ' + slav(n, f),
  runs: ['пробежка','пробежки','пробежек'], runsBecame: ['пробежка стала','пробежки стали','пробежек стали'], runsStopped: ['пробежка перестала','пробежки перестали','пробежек перестали'],
  workouts: ['тренировки','тренировок','тренировок'], weeks: ['неделя','недели','недель'], runsGen: ['пробежки','пробежек','пробежек'],
  MR: ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'],
  MF: ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'],
  DN: ['пн','вт','ср','чт','пт','сб','вс'], date: (d, mf) => `${d} ${mf}`,
  title: 'Беговой дашборд InnaTri', mark_sub: 'беговой дашборд', seg: 'Период', mo: 'мес',
  meta_demo: 'пример на реальных данных по ключу Garmin', meta: d => `собрано ${d} по ключу Garmin`,
  built_demo: 'Пример дашборда · InnaTri', built: (d, y) => `Собрано ${d} ${y} · InnaTri`,
  kick: (name, a, b, runs, km, h) => `${name ? name + ' · ' : ''}${a} по ${b} · ${runs} · ${km} км · ${h} ч`,
  verdict: {
    few: (m, n) => ['Мало данных', `За ${m} мес. всего ${n} с часами. Вердикт по такому объёму был бы гаданием. Переключите период на больший или вернитесь через месяц.`],
    nohr: (a, b) => ['Пульс записан не везде', `Только ${a} из ${b} пробежек с пульсом. Без пульса дашборд видит километры, но не нагрузку. Проверьте датчик или ремень.`],
    hard: (low, fast, hr) => ['Лёгкие пробежки не лёгкие', `${low} времени бега прошло в 1–2 зонах при тренерском ориентире 75–80%. ${fast} из ${hr} пробежек по пульсу были быстрее лёгкого. Лишняя скорость на лёгких съедает качество ключевых тренировок и восстановление.`],
    streak: n => [`${n} недель подряд без разгрузки`, 'Нагрузка росла без лёгкой недели. Рабочая схема: три недели работы, одна разгрузочная. Без неё форма не закрепляется, а усталость копится незаметно.'],
    ragged: (e, n) => ['Рваный график', `${e} пустых недель из ${n}. Пропуски стоят дороже, чем любая отдельная тренировка. Три коротких пробежки в неделю дадут больше, чем две длинных через неделю.`],
    ok: (low, pw) => ['База в порядке', `${low} бега в 1–2 зонах, разгрузка не реже чем раз в четыре недели, ${pw} пробежки в неделю. Следующий шаг: вторая ключевая тренировка в неделю и контроль аэробной эффективности.`],
  },
  warn: { formula: 'Зоны в часах считаются от максимального пульса. Если максимум не измерен, а взят по формуле 220 минус возраст, граница лёгкого может быть сдвинута на 5–10 ударов. Проверьте его в настройках Garmin.',
          no_zones: 'Зоны в Garmin не настроены, граница лёгкого прикинута от максимального пульса.',
          no_data: 'Garmin не отдал ни зон, ни порога. Граница лёгкого взята по умолчанию, цифрам по зонам верить нельзя.' },
  src: { manual: 'задана вручную', zone_lt: l => `верх 2-й зоны в ваших часах, зоны от порога ${l}`, zone_hrr: m => `верх 2-й зоны в ваших часах, зоны от резерва пульса, максимум ${m}`, zone_max: m => `верх 2-й зоны в ваших часах, зоны от максимума ${m}`, lthr: l => `86% от порога ${l}`, maxhr: m => `79% от максимума ${m}`, default: 'по умолчанию, зоны не найдены' },
  fig: {
    low: 'времени бега в 1–2 зонах, тренерский ориентир 75–80%', easy: n => `из ${n} пробежек были лёгкими при границе`,
    streak: 'недель подряд без разгрузочной (лёгкой) недели, допустимо до трёх', streak_d: (d, h) => `разгрузочных недель за период <b>${d}</b>, ударных <b>${h}</b>`,
    eff: 'метра пробегаете за один удар сердца на лёгких. Это экономичность бега: чем больше, тем дешевле даётся темп', eff_d: 'аэробная эффективность',
    last3: 'за последние 3 месяца', delta: (c, s, d) => `последние 3 мес. <b>${c}</b>, к предыдущим 3 <b class="${s}">${d}</b>`, wk: 'нед.', m: 'м',
  },
  hz_h2: 'Каждая пробежка относительно границы лёгкого',
  hz_lead: (src, v) => `Белая линия: ${src}, ${v}. Каждая точка пробежка: высота её средний пульс, размер длина. Над линией красные. Потяните линию и посмотрите, как вердикт зависит от одной настройки в часах.`,
  hz_src_zone: 'верх 2-й зоны из ваших часов', hz_src_other: 'граница лёгкого',

  const cut = sorted.length ? sorted[Math.floor(sorted.length*.8)] : Infinity;
  weeks.forEach(w => w.hard = w.load > 0 && w.load >= cut);
  const z = [0,1,2,3,4].map(i => S.runs.reduce((s,r)=>s+r.z[i],0)); const tot = z.reduce((a,b)=>a+b,0) || 1;

  return { monthly, weeks, best, bestEnd, low: (z[0]+z[1])/tot, high: (z[3]+z[4])/tot,
    n: S.runs.length, km: S.runs.reduce((s,r)=>s+r.km,0), hours: S.runs.reduce((s,r)=>s+r.dur,0)/3600, hrRuns: hrRuns.length, fast: S.runs.filter(r=>r.fast).length,
    easyHr: easyRuns.length ? Math.round(mean(easyRuns.map(r=>r.hr))) : null, eff: median(easyRuns.filter(okMpb).map(r=>r.mpb)),
    emptyWeeks, perWeek: S.runs.length / Math.max(1, weeks.length), noHr: S.runs.length - hrRuns.length, easyN: easyRuns.length,
    hardWeeks: weeks.filter(w=>w.hard).length, deloads: weeks.filter(w=>w.deload && w.load>0).length };
}

function verdict(A, months){
  const V = T.verdict;
  if (A.n < 6) return V.few(months, P(A.n, T.runs));
  if (A.hrRuns < A.n * .6) return V.nohr(A.hrRuns, A.n);
  if (A.low < .7) return V.hard(pct(A.low), A.fast, A.hrRuns);
  if (A.best >= 4) return V.streak(A.best);
  if (A.emptyWeeks > A.weeks.length * .25) return V.ragged(A.emptyWeeks, A.weeks.length);
  return V.ok(pct(A.low), A.perWeek.toFixed(1));
}

  let path = '', pen = false;
  weeks.forEach((wk, i) => { if (!wk.rhrAvg) { pen = false; return; } path += (pen ? 'L' : 'M') + x(i) + ' ' + y(wk.rhrAvg); pen = true; });
  o.push(`<path d="${path}" fill="none" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`);
  weeks.forEach((wk, i) => { if (wk.rhrAvg) o.push(`<circle cx="${x(i)}" cy="${y(wk.rhrAvg)}" r="7" fill="transparent" data-tip="${esc(`<b>${T.week_from} ${fmtD(wk.key)}</b><br>${T.rhr} ${wk.rhrAvg.toFixed(1)} · ${wk.rhr.length} ${T.days}${wk.hard ? '<br>' + T.hard_week : ''}`)}"/>`); });
  let lastM = '';
  weeks.forEach((wk, i) => { const m = wk.key.slice(0,7); if (m !== lastM && wk.start.getDate() <= 7) { o.push(`<text x="${L_ + i*cw}" y="${h-8}" fill="${C.mute}" font-size="12">${MR[+m.slice(5)-1]}</text>`); lastM = m; } });
  o.push('</svg>');
  el.innerHTML = o.join(''); attachTips(el);
}

function drillMonth(m){
  const box = $('#drill'); if (!m) return;
  const rows = m.runs.map(r => `<tr><td>${fmtD(r.date)}</td><td class="name">${esc(r.name)}${r.indoor ? ' · ' + T.treadmill : ''}</td><td class="n">${r.km.toFixed(1)}</td><td class="n">${pace(r.pace)}</td><td class="n ${r.fast?'fast':''}">${r.hr || '–'}</td><td class="n">${r.hrmax || '–'}</td><td class="n ${r.hiShare>=.05?'fast':''}">${pct(r.hiShare)}</td><td class="n">${r.load}</td><td>${r.easy ? T.o_easy : r.hr ? T.o_fast : T.o_nohr}</td></tr>`).join('');
  const th = T.th_month.map((t, i) => `<th class="${i >= 2 && i <= 7 ? 'n' : ''}">${t}</th>`).join('');
  box.innerHTML = `<div class="hd"><h3>${m.label}: ${P(m.n, T.runs)}, ${m.km.toFixed(0)} ${T.km}</h3><button class="cl" onclick="this.closest('.drill').classList.remove('on')">${T.close}</button></div>
  <div style="overflow:auto"><table><thead><tr>${th}</tr></thead><tbody>${rows || `<tr><td colspan="9">${T.no_runs}</td></tr>`}</tbody></table></div>`;
  box.classList.add('on'); box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

// ---------- плитки с анимацией счёта ----------
function countTo(el, to, fmt){
  if (reduced || to == null || !isFinite(to)) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 700;
  const step = t => { const k = Math.min(1, (t - t0)/dur), e = 1 - Math.pow(1-k, 3); el.textContent = fmt(to*e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function figures(A, Pp, animate){
  const F = T.fig;
  const dl = (cur, prev, fmt, goodUp) => {
    if (prev == null || cur == null) return `<div class="d">${F.last3}</div>`;
    const d = cur - prev; const sign = d > 0 ? '+' : d < 0 ? '−' : '';
    const cls = d === 0 ? '' : (d > 0) === goodUp ? 'good' : 'bad';
    return `<div class="d">${F.delta(fmt(cur), cls, sign + fmt(Math.abs(d)))}</div>`;
  };
  const items = [
    { v: A.hrRuns ? A.low*100 : null, f: v => v == null ? '–' : Math.round(v) + '%', l: F.low, d: Pp ? dl(Math.round(Pp.cur.low*100), Math.round(Pp.prev.low*100), v => v + '%', true) : '' },
    { v: A.easyN, f: v => Math.round(v), l: `${F.easy(A.hrRuns)} ${CEIL}`, d: Pp ? dl(Math.round(Pp.cur.easyN/Math.max(1,Pp.cur.hrRuns)*100), Math.round(Pp.prev.easyN/Math.max(1,Pp.prev.hrRuns)*100), v => v + '%', true) : '' },
    { v: A.best, f: v => Math.round(v), suf: ' ' + F.wk, l: F.streak, d: `<div class="d">${F.streak_d(A.deloads, A.hardWeeks)}</div>` },
    { v: A.eff, f: v => v ? v.toFixed(2) : '–', suf: ' ' + F.m, l: F.eff, d: Pp && Pp.cur.eff && Pp.prev.eff ? dl(+Pp.cur.eff.toFixed(2), +Pp.prev.eff.toFixed(2), v => v.toFixed(2), true) : `<div class="d">${F.eff_d}</div>` },
  ];
  $('#figs').innerHTML = items.map(i => `<div class="fig"><div class="v"><span class="count"></span><small>${i.suf || ''}</small></div><div class="l">${i.l}</div>${i.d}</div>`).join('');
  document.querySelectorAll('#figs .count').forEach((el, i) => animate ? countTo(el, items[i].v, items[i].f) : (el.textContent = items[i].f(items[i].v)));
}

// ---------- управление ----------
function setCeil(v){
  v = Math.max(115, Math.min(175, v)); if (v === CEIL) return;
  CEIL = v; $('#ceil').value = v; render(false);
}
$('#ceil').addEventListener('input', e => setCeil(+e.target.value));
$('#ceil-reset').addEventListener('click', () => setCeil(D.ceiling));
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { period = +b.dataset.p; openWeek = null; document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(true); }));

let baseEasy = null;
function render(entrance){
  classify();
  const start = range(period, LAST), S = slice(start, LAST), A = aggregate(S);
  const months = Math.max(1, Math.round((LAST - start) / 2629800000));
  let Pp = null;
  if (months >= 6) {
    const c0 = range(3, LAST), p0 = range(6, LAST), p1 = new Date(c0); p1.setDate(0);
    Pp = { cur: aggregate(slice(c0, LAST)), prev: aggregate(slice(p0, p1)) };
  }
  const [vt, vx] = verdict(A, months);
  const yr = d => D.hide_year ? '' : ' ' + d.getFullYear();
  $('#kick').textContent = T.kick(D.name, fmtD(iso(start)) + yr(start), fmtD(iso(LAST)) + yr(LAST), P(A.n, T.runs), A.km.toFixed(0), A.hours.toFixed(0));
  $('#v-title').textContent = vt; $('#v-text').textContent = vx;
  $('#meta').textContent = D.hide_year ? T.meta_demo : T.meta(fmtD(D.built));
  $('#built').textContent = D.hide_year ? T.built_demo : T.built(fmtD(D.built), d2(D.built).getFullYear());
  $('#warns').innerHTML = warnText().map(w => `<p class="warn">${esc(w)}</p>`).join('');
  figures(A, Pp, entrance);
  $('#hz-lead').textContent = T.hz_lead((D.ceiling_kind || '').startsWith('zone') ? T.hz_src_zone : T.hz_src_other, D.ceiling);
  chartHorizon(S, A);
  const easyPct = A.hrRuns ? Math.round(A.easyN / A.hrRuns * 100) : 0;
  if (baseEasy === null || CEIL === D.ceiling) baseEasy = A.easyN;
  $('#hz-read').innerHTML = T.hz_read(A.easyN, A.hrRuns, easyPct, A.easyHr || '–', A.fast);
  const d = CEIL - D.ceiling, dn = A.easyN - baseEasy;
  $('#hz-shift').innerHTML = d === 0 ? T.hz_same : T.hz_shift(d, dn, P);
  chartTape(A);
  chartInt(A.monthly); chartEasy(A.monthly); chartEff(A.monthly); chartRhr(A.weeks);
  $('#how').innerHTML = T.how(A, CEIL, srcText()).filter(Boolean).map(s => `<li>${s}</li>`).join('');
  $('#drill').classList.remove('on'); $('#drill-run').classList.remove('on');
  if (entrance && !reduced) { document.body.classList.add('pre'); requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('pre'))); }
}
$('#ceil').value = CEIL;
if (reduced) document.body.classList.remove('pre');
render(true);
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => render(false), 150); });
</script>
